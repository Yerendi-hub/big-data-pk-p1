services:
  mongo:
    image: mongo:7
    container_name: bigdata-mongo
    restart: unless-stopped
    command: ["mongod", "--auth",
              "--tlsMode", "requireTLS",
              "--tlsCertificateKeyFile", "/etc/mongo-tls/server.pem",
              "--tlsCAFile", "/etc/mongo-tls/ca.pem",
              "--tlsAllowConnectionsWithoutCertificates"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./tls:/etc/mongo-tls:ro

  namenode:
    image: apache/hadoop:3.4.1
    container_name: hadoop-namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    env_file: ./hadoop.env
    environment:
      ENSURE_NAMENODE_DIR: "/tmp/hadoop-hadoop/dfs/name"
    ports:
      - "9870:9870"   # HDFS web UI
    volumes:
      - ./data/tsv:/data/tsv:ro          # TSV files to upload to HDFS
      - ./map_reducer:/map_reducer:ro    # mappers and reducers for Hadoop Streaming

  datanode:
    image: apache/hadoop:3.4.1
    container_name: hadoop-datanode
    command: ["hdfs", "datanode"]
    env_file: ./hadoop.env

  resourcemanager:
    image: apache/hadoop:3.4.1
    container_name: hadoop-resourcemanager
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    env_file: ./hadoop.env
    ports:
      - "8088:8088"   # YARN web UI

  nodemanager:
    build: ./docker/nodemanager
    image: lichess-hadoop-nodemanager
    container_name: hadoop-nodemanager
    command: ["yarn", "nodemanager"]
    env_file: ./hadoop.env

volumes:
  mongo-data: